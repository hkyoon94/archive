[tool.poetry]
name = "physical-rc"
packages = [
  {include = "etl"},
  {include = "rc"},
]
version = "0.1.0"
description = ""
authors = ["hyeonch <hyeonchan@pozalabs.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26.4"
numba = "*"
torch = "^2.2.1"
pandas = "^2.2.1"
scipy = "^1.12.0"
yacs = "^0.1.8"
xgboost = "^2.0.3"
scikit-learn = "^1.4.1.post1"
wandb = "^0.16.4"
ipykernel = "*"
ipywidgets = "*"
matplotlib = "*"
plotly = "*"
nbformat = "^4.2.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
